<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IQ TEST</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050508;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>

<div id="game-container">
  <canvas id="gameCanvas" width="1000" height="700"></canvas>
</div>

  const ctx = canvas.getContext("2d");

  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioCtx.state === "suspended") {

  const introSound = new Audio(INTRO_AUDIO_SRC);
  introSound.volume = 0.5;

  const BLACK = "#050508";
  const WHITE = "#f5f5f5";
  const TEXT_DARK = "#505050";
  const TEXT_MID = "#969696";

  const BRIGHT = ["#eb2828", "#28d246", "#326ef0", "#f0c81e"];
  const DARK = ["#460a0a", "#0a4614", "#0a1e50", "#50410a"];
  const NAMES = ["RED", "GREEN", "BLUE", "YELLOW"];

  const buttons = [
    { x: 100, y: 250, w: 350, h: 170 },
    { x: 550, y: 250, w: 350, h: 170 },
    { x: 100, y: 450, w: 350, h: 170 },
    { x: 550, y: 450, w: 350, h: 170 }
  ];

  const testBtn = { x: 250, y: 320, w: 500, h: 100 };
  const yesBtn  = { x: 220, y: 480, w: 260, h: 90 };
  const noBtn   = { x: 520, y: 480, w: 260, h: 90 };

  let state = "audio_check";
  let audioTested = false;
  let audioWarning = false;

  let sequence = [];
  let player_index = 0;
  let show_index = 0;
  let turn = 0;
  let score = 0;
  let last_flash = 0;
  let active_color = -1;
  let scare_start = 0;

  const FLASH_DURATION = 850;
  const PAUSE_DURATION = 300;
  const scare_duration = 3500;

  function playTone(freq, duration = 0.22, volume = 0.5) {
    if (!audioCtx) return;

    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(
        volume,
        audioCtx.currentTime + 0.02
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + duration
      );

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  const FREQS = [261.63, 329.63, 392.00, 523.25];

  function playColorSound(index) {
    playTone(FREQS[index]);
  }

  function stopJumpscareSound() {
    // Generated jumpscare scream removed.
  }

  function drawText(text, font, color, x, y) {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x, y);
  }

  function drawRoundRect(
    x,
    y,
    w,
    h,
    radius,
    fillStyle,
    strokeStyle,
    strokeWidth
  ) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();

    ctx.fillStyle = fillStyle;
    ctx.fill();

    if (strokeStyle) {
      ctx.lineWidth = strokeWidth;
      ctx.strokeStyle = strokeStyle;
      ctx.stroke();
    }
  }

  function drawButtons(active = -1) {
    buttons.forEach((rect, i) => {
      if (i === active) {
        drawRoundRect(
          rect.x,
          rect.y,
          rect.w,
          rect.h,
          25,
          BRIGHT[i],
          WHITE,
          8
        );

        drawText(
          NAMES[i],
          "bold 38px Arial",
          WHITE,
          rect.x + rect.w / 2,
          rect.y + rect.h / 2
        );
      } else {
        drawRoundRect(
          rect.x,
          rect.y,
          rect.w,
          rect.h,
          25,
          DARK[i],
          null,
          0
        );
      }
    });
  }

  function drawFace() {
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const shakeX = Math.floor(Math.random() * 71) - 35;
    const shakeY = Math.floor(Math.random() * 71) - 35;

    const cx = canvas.width / 2 + shakeX;
    const cy = canvas.height / 2 + shakeY;

    ctx.fillStyle = "rgb(225, 220, 205)";

    ctx.beginPath();
    ctx.ellipse(
      cx,
      cy,
      320,
      300,
      0,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = BLACK;

    ctx.beginPath();
    ctx.ellipse(
      cx - 145,
      cy - 35,
      65,
      95,
      0,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(
      cx + 145,
      cy - 35,
      65,
      95,
      0,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = WHITE;

    ctx.beginPath();
    ctx.arc(
      cx - 145,
      cy - 40,
      32,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
      cx + 145,
      cy - 40,
      32,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = "rgb(25, 25, 25)";

    ctx.beginPath();
    ctx.moveTo(cx, cy - 30);
    ctx.lineTo(cx - 45, cy + 80);
    ctx.lineTo(cx + 45, cy + 80);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = BLACK;

    ctx.beginPath();
    ctx.ellipse(
      cx,
      cy + 185,
      190,
      85,
      0,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = WHITE;

    for (let x = cx - 160; x < cx + 160; x += 30) {
      ctx.beginPath();
      ctx.moveTo(x, cy + 110);
      ctx.lineTo(x + 18, cy + 110);
      ctx.lineTo(x + 9, cy + 160);
      ctx.closePath();
      ctx.fill();
    }

    if (Math.random() < 0.45) {
      ctx.fillStyle =
        `rgba(255, 0, 0, ${(Math.random() * 100 + 50) / 255})`;

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );
    }
  }

  function newTurn() {
    turn++;

    sequence.push(
      Math.floor(Math.random() * 4)
    );

    player_index = 0;
    show_index = 0;
    last_flash = Date.now();
    active_color = -1;
    state = "showing";
  }

  function startGame() {
    sequence = [];
    player_index = 0;
    show_index = 0;
    turn = 0;
    score = 0;
    active_color = -1;

    newTurn();
  }

  function startJumpscare() {
    state = "scare";
    scare_start = Date.now();

    introSound.pause();
    introSound.currentTime = 0;

    // No scream is played here.
  }

  function handleInput(x, y) {
    initAudio();

    if (state === "audio_check") {

      if (
        x >= testBtn.x &&
        x <= testBtn.x + testBtn.w &&
        y >= testBtn.y &&
        y <= testBtn.y + testBtn.h
      ) {
        playTone(440, 0.4, 0.6);
        audioTested = true;
        audioWarning = false;
      }

      else if (
        audioTested &&
        x >= yesBtn.x &&
        x <= yesBtn.x + yesBtn.w &&
        y >= yesBtn.y &&
        y <= yesBtn.y + yesBtn.h
      ) {
        introSound.play().catch(() => {});
        state = "menu";
      }

      else if (
        audioTested &&
        x >= noBtn.x &&
        x <= noBtn.x + noBtn.w &&
        y >= noBtn.y &&
        y <= noBtn.y + noBtn.h
      ) {
        audioWarning = true;
      }

    } else if (state === "menu") {

      startGame();

    } else if (state === "waiting") {

      if (turn >= 3) {

        startJumpscare();

      } else {

        let clicked = -1;

        buttons.forEach((rect, i) => {
          if (
            x >= rect.x &&
            x <= rect.x + rect.w &&
            y >= rect.y &&
            y <= rect.y + rect.h
          ) {
            clicked = i;
          }
        });

        if (clicked !== -1) {

          playColorSound(clicked);

          if (clicked === sequence[player_index]) {

            player_index++;
            score += 10;

            if (player_index >= sequence.length) {
              state = "next";

              setTimeout(() => {
                if (state === "next") {
                  newTurn();
                }
              }, 350);
            }

          } else {

            state = "menu";

          }
        }
      }
    }
  }

  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();

    const touch = e.touches
      ? e.touches[0]
      : (e.changedTouches ? e.changedTouches[0] : e);

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    return {
      x: (touch.clientX - rect.left) * scaleX,
      y: (touch.clientY - rect.top) * scaleY
    };
  }

  window.addEventListener(
    "pointerdown",
    (e) => {
      e.preventDefault();

      const coords = getCanvasCoords(e);

      handleInput(
        coords.x,
        coords.y
      );
    },
    { passive: false }
  );

  let playedToneForStep = false;

  function loop() {
    const now = Date.now();

    if (state === "audio_check") {

      ctx.fillStyle = BLACK;
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawText(
        "AUDIO CHECK",
        "bold 52px Arial",
        WHITE,
        canvas.width / 2,
        130
      );

      drawText(
        "This test requires sound to play properly.",
        "22px Arial",
        TEXT_MID,
        canvas.width / 2,
        200
      );

      drawRoundRect(
        testBtn.x,
        testBtn.y,
        testBtn.w,
        testBtn.h,
        20,
        "#326ef0",
        WHITE,
        3
      );

      drawText(
        "🔊 TAP TO TEST SOUND",
        "bold 30px Arial",
        WHITE,
        canvas.width / 2,
        testBtn.y + testBtn.h / 2
      );

      if (audioTested) {

        drawText(
          "Did you hear the beep?",
          "bold 28px Arial",
          WHITE,
          canvas.width / 2,
          440
        );

        drawRoundRect(
          yesBtn.x,
          yesBtn.y,
          yesBtn.w,
          yesBtn.h,
          20,
          "#28d246",
          null,
          0
        );

        drawText(
          "YES",
          "bold 32px Arial",
          WHITE,
          yesBtn.x + yesBtn.w / 2,
          yesBtn.y + yesBtn.h / 2
        );

        drawRoundRect(
          noBtn.x,
          noBtn.y,
          noBtn.w,
          noBtn.h,
          20,
          "#eb2828",
          null,
          0
        );

        drawText(
          "NO",
          "bold 32px Arial",
          WHITE,
          noBtn.x + noBtn.w / 2,
          noBtn.y + noBtn.h / 2
        );
      }

      if (audioWarning) {
        drawText(
          "Turn OFF Silent/Mute Mode on your phone & increase volume!",
          "bold 20px Arial",
          "#eb2828",
          canvas.width / 2,
          630
        );
      }

    } else if (state === "menu") {

      ctx.fillStyle = BLACK;
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawText(
        "IQ TEST",
        "bold 72px Arial",
        WHITE,
        canvas.width / 2,
        170
      );

      drawText(
        "MEMORY & REACTION TEST",
        "bold 38px Arial",
        TEXT_MID,
        canvas.width / 2,
        280
      );

      drawText(
        "TAP ANYWHERE TO BEGIN",
        "bold 38px Arial",
        WHITE,
        canvas.width / 2,
        430
      );

      drawText(
        "FOLLOW THE COLOURS",
        "24px Arial",
        TEXT_DARK,
        canvas.width / 2,
        500
      );

    } else if (state === "showing") {

      ctx.fillStyle = BLACK;
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawText(
        "WATCH CAREFULLY",
        "bold 38px Arial",
        WHITE,
        canvas.width / 2,
        70
      );

      const cycle =
        FLASH_DURATION + PAUSE_DURATION;

      const elapsed =
        now - last_flash;

      if (elapsed >= cycle) {
        show_index++;
        last_flash = now;
        playedToneForStep = false;
      }

      if (show_index < sequence.length) {

        if (elapsed < FLASH_DURATION) {

          active_color =
            sequence[show_index];

          drawButtons(active_color);

          if (
            elapsed < 100 &&
            !playedToneForStep
          ) {
            playColorSound(active_color);
            playedToneForStep = true;
          }

        } else {

          drawButtons(-1);

        }

      } else {

        state = "waiting";

      }

    } else if (state === "waiting") {

      ctx.fillStyle = BLACK;
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawText(
        "YOUR TURN",
        "bold 38px Arial",
        WHITE,
        canvas.width / 2,
        70
      );

      drawButtons(-1);

      ctx.font = "24px Arial";
      ctx.fillStyle = "#8c8c8c";
      ctx.textAlign = "left";

      ctx.fillText(
        `ROUND ${turn}`,
        100,
        30
      );

      ctx.textAlign = "right";

      ctx.fillText(
        `SCORE: ${score}`,
        900,
        30
      );

    } else if (state === "next") {

      ctx.fillStyle = BLACK;
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawText(
        "CORRECT",
        "bold 72px Arial",
        WHITE,
        canvas.width / 2,
        canvas.height / 2
      );

    } else if (state === "scare") {

      if (now - scare_start < scare_duration) {

        drawFace();

      } else {

        stopJumpscareSound();

        state = "audio_check";
        audioTested = false;
        audioWarning = false;

        introSound.volume = 1.0;
        introSound.currentTime = 0;
      }
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>

</body>
</html>
